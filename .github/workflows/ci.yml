name: ci

on:
  push:
    branches: [main, staging, "feature/**"]
  pull_request:
    branches: [main, staging]

# Prevents duplicate runs per branch/PR when new commits arrive
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-ci:
    name: Node 20 · npm · lint/type/build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20 with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Detect package.json
        id: pkg
        run: |
          if [ -f package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Exit early if no package.json yet
        if: steps.pkg.outputs.present == 'false'
        run: |
          echo "No package.json yet. Skipping install/lint/type/build."
          exit 0

      - name: Clean install
        run: npm ci

      - name: Lint (skips if no script)
        run: |
          if npm run | grep -qE '^ *lint'; then
            npm run lint
          else
            echo "No lint script. Skipping."
          fi

      - name: Typecheck (skips if no script)
        run: |
          if npm run | grep -qE '^ *typecheck'; then
            npm run typecheck
          else
            echo "No typecheck script. Skipping."
          fi

      - name: Build (skips if no script)
        run: |
          if npm run | grep -qE '^ *build'; then
            npm run build
          else
            echo "No build script. Skipping."
          fi
