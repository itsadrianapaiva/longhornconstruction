<!-- CÉU Email Signature Template v2.2 -->
<!-- Notes:
  1) Paths are ROOT-RELATIVE so you can preview on localhost:
     http://localhost:3000/email-signatures/_template.html
     Before sharing with colleagues, open the per-person HTML on the LIVE DOMAIN to copy (not localhost).
  2) Icons are inline SVG (Lucide) to avoid sizing glitches across clients.
  3) Left block uses background image with Outlook VML fallback.
-->
<table cellpadding="0" cellspacing="0" role="presentation" style="font-family: Arial, sans-serif; color:#1e2129; line-height:1.4;">
  <tr>
    <!-- Left visual: background + logo with Outlook fallback -->
    <!--[if mso]>
    <td style="padding-right:16px; border-right:2px solid #1a539e;">
      <v:rect xmlns:v="urn:schemas-microsoft-com:vml" fill="true" stroke="false" style="width:140px;height:110px;">
        <v:fill type="frame" src="/email-signatures/background.jpeg" color="#1a539e"/>
        <v:textbox inset="0,0,0,0">
          <div style="text-align:center;">
            <!-- White mask behind logo for readability -->
            <table role="presentation" cellpadding="0" cellspacing="0" align="center">
              <tr>
                <td style="padding:8px; background:#ffffff; border-radius:6px;">
                  <img src="/email-signatures/logo-white.png" alt="CÉU Construction" width="110" style="display:block;">
                </td>
              </tr>
            </table>
          </div>
        </v:textbox>
      </v:rect>
    </td>
    <![endif]-->

    <!--[if !mso]><!-->
    <td style="padding-right:16px; border-right:2px solid #1a539e; background:url('/email-signatures/background.jpeg') center/cover no-repeat; width:140px; height:110px; text-align:center; vertical-align:middle;">
      <!-- “Mask” placard behind logo -->
      <span style="display:inline-block; background:#ffffff; padding:8px; border-radius:6px;">
        <img src="/email-signatures/logo-white.png" alt="CÉU Construction" width="110" style="display:block;">
      </span>
    </td>
    <!--<![endif]-->

    <!-- Right content -->
    <td style="padding-left:16px;">
      <p style="margin:0; font-size:16px; font-weight:bold; color:#1a539e;">{{FULL_NAME}}</p>
      <p style="margin:0; font-size:13px;">{{JOB_TITLE}}</p>

      <!-- Phone + WhatsApp -->
      <p style="margin:10px 0 0 0; font-size:13px;">
        <!-- Phone icon -->
        <span style="display:inline-block; line-height:0; vertical-align:middle; margin-right:6px;">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.09 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.9.3 1.78.54 2.63a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.45-1.11a2 2 0 0 1 2.11-.45c.85.24 1.73.42 2.63.54A2 2 0 0 1 22 16.92z"/></svg>
        </span>
        <a href="tel:{{PHONE_E164}}" style="color:#1e2129; text-decoration:none; vertical-align:middle;">{{PHONE_DISPLAY}}</a>

        <span style="color:#8a8f98;">&nbsp;&nbsp;|&nbsp;&nbsp;</span>

        <!-- WhatsApp icon -->
        <span style="display:inline-block; line-height:0; vertical-align:middle; margin-right:6px;">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11.5A8.5 8.5 0 1 1 11.5 3 8.5 8.5 0 0 1 20 11.5Z"/><path d="m3 21 1.9-5.5"/><path d="M8 10s1 3 4 4 3-1 3-1"/></svg>
        </span>
        <a href="{{WHATSAPP_LINK}}" style="color:#1e2129; text-decoration:none; vertical-align:middle;">WhatsApp</a>
      </p>

      <!-- Email -->
      <p style="margin:6px 0 0 0; font-size:13px;">
        <span style="display:inline-block; line-height:0; vertical-align:middle; margin-right:6px;">
          <!-- Mail icon -->
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m4 4 8 8 8-8"/><path d="M20 4H4v16h16z" opacity="0"/></svg>
        </span>
        <a href="mailto:{{EMAIL}}" style="color:#1e2129; text-decoration:none; vertical-align:middle;">{{EMAIL}}</a>
      </p>

      <!-- Website -->
      <p style="margin:6px 0 0 0; font-size:13px;">
        <span style="display:inline-block; line-height:0; vertical-align:middle; margin-right:6px;">
          <!-- Globe icon -->
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        </span>
        <a href="https://ceuconstruction.com" style="color:#1a539e; text-decoration:none; vertical-align:middle;">ceuconstruction.com</a>
      </p>

      <!-- Motto -->
      <p style="margin:10px 0 0 0; font-size:11px; color:#1a539e;">
        Think beyond the sky...
      </p>
    </td>
  </tr>
</table>
