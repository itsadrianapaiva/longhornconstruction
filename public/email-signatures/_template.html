<!-- CÉU Email Signature — Template v2.3 (Final Universal) -->
<table role="presentation" cellpadding="0" cellspacing="0" border="0"
       width="100%"
       style="width:100%; min-width:100%;
              font-family:Arial, sans-serif; color:#1e2129; background:#ffffff;
              -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%;">
  <tr>
    <td bgcolor="#ffffff" style="padding:0; background:#ffffff;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0"
             width="100%"
             style="width:100%; border-collapse:collapse; background:#ffffff; table-layout:fixed;">
        <tr>
          <td width="120" valign="middle" align="left"
              style="width:120px; padding:0 14px 0 0; background:#ffffff;">
            <img src="https://ceuconstruction.com/email-signatures/logo-art.png"
                 alt="CÉU Construction" width="120"
                 style="display:block; width:120px; height:auto; border:0; outline:0; text-decoration:none;">
          </td>

          <td width="3" valign="top"
              style="width:3px; background-color:#1a539e; font-size:0; line-height:0;">&nbsp;</td>

          <td width="100%" valign="middle" align="left"
              style="width:100%; padding:0 0 0 14px; background:#ffffff;">
            <p style="margin:0; font-size:16px; font-weight:bold; color:#1a539e; line-height:1.3;">[FULL_NAME]</p>
            <p style="margin:2px 0 0 0; font-size:13px; line-height:1.3;">[JOB_TITLE]</p>

            <p style="margin:10px 0 0 0; font-size:13px; line-height:1.45;">
              <img src="https://ceuconstruction.com/email-signatures/icons/phone.png" alt="" width="16" height="16"
                   style="display:inline-block; vertical-align:middle; margin-right:6px;">
              <a href="tel:[PHONE_E164]" style="color:#1e2129; text-decoration:none; vertical-align:middle;">[PHONE_DISPLAY]</a>
              <span style="color:#8a8f98;">&nbsp;|&nbsp;</span>
              <a href="https://wa.me/[WHATSAPP_E164_DIGITS]" style="text-decoration:none; vertical-align:middle;">
                <img src="https://ceuconstruction.com/email-signatures/icons/whatsapp.png" alt="WhatsApp" width="16" height="16"
                     style="display:inline-block; vertical-align:middle; margin-left:6px;">
              </a>
            </p>

            <p style="margin:6px 0 0 0; font-size:13px; line-height:1.45; word-break:break-word;">
              <img src="https://ceuconstruction.com/email-signatures/icons/mail.png" alt="" width="16" height="16"
                   style="display:inline-block; vertical-align:middle; margin-right:6px;">
              <a href="mailto:[EMAIL]" style="color:#1e2129; text-decoration:none; vertical-align:middle;">[EMAIL]</a>
            </p>

            <p style="margin:6px 0 0 0; font-size:13px; line-height:1.45;">
              <img src="https://ceuconstruction.com/email-signatures/icons/globe.png" alt="" width="16" height="16"
                   style="display:inline-block; vertical-align:middle; margin-right:6px;">
              <a href="https://ceuconstruction.com" style="color:#1a539e; text-decoration:none; vertical-align:middle;">ceuconstruction.com</a>
            </p>

            <p style="margin:10px 0 0 0; font-size:14px; color:#1a539e; font-weight:bold; font-style:italic; line-height:1.3;">
              Think beyond the sky...
            </p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
