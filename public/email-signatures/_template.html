<!-- CÉU Email Signature Template v3.1.2 -->
<table role="presentation" cellpadding="0" cellspacing="0" style="font-family: Arial, sans-serif; color:#1e2129; line-height:1.35;">
  <tr>
    <!-- Left: logo, top-aligned, no extra vertical padding -->
    <td valign="top" style="padding:0 16px 0 0; border-right:2px solid #1a539e;">
      <img src="https://ceuconstruction.com/email-signatures/logo-art.png" alt="CÉU Construction" width="140" style="display:block; width:140px; height:auto;">
    </td>

    <!-- Right: text block, top-aligned, compact spacing -->
    <td valign="top" style="padding:0 0 0 16px;">
      <p style="margin:0; font-size:16px; font-weight:bold; color:#1a539e;">[FULL_NAME]</p>
      <p style="margin:2px 0 0 0; font-size:13px;">[JOB_TITLE]</p>

      <p style="margin:10px 0 0 0; font-size:13px;">
        <img src="https://ceuconstruction.com/email-signatures/icons/phone.png" alt="" width="16" height="16" style="display:inline-block; width:16px; height:16px; vertical-align:middle; margin-right:6px;">
        <a href="tel:[PHONE_E164]" style="color:#1e2129; text-decoration:none; vertical-align:middle;">[PHONE_DISPLAY]</a>
        <span style="color:#8a8f98;">&nbsp;&nbsp;|&nbsp;&nbsp;</span>
        <img src="https://ceuconstruction.com/email-signatures/icons/whatsapp.png" alt="" width="16" height="16" style="display:inline-block; width:16px; height:16px; vertical-align:middle; margin-right:6px;">
        <a href="https://wa.me/[WHATSAPP_E164_DIGITS]" style="color:#1e2129; text-decoration:none; vertical-align:middle;">WhatsApp</a>
      </p>

      <p style="margin:6px 0 0 0; font-size:13px;">
        <img src="https://ceuconstruction.com/email-signatures/icons/mail.png" alt="" width="16" height="16" style="display:inline-block; width:16px; height:16px; vertical-align:middle; margin-right:6px;">
        <a href="mailto:[EMAIL]" style="color:#1e2129; text-decoration:none; vertical-align:middle;">[EMAIL]</a>
      </p>

      <p style="margin:6px 0 0 0; font-size:13px;">
        <img src="https://ceuconstruction.com/email-signatures/icons/globe.png" alt="" width="16" height="16" style="display:inline-block; width:16px; height:16px; vertical-align:middle; margin-right:6px;">
        <a href="https://ceuconstruction.com" style="color:#1a539e; text-decoration:none; vertical-align:middle;">ceuconstruction.com</a>
      </p>

      <p style="margin:10px 0 0 0; font-size:11px; color:#1a539e; font-weight:bold; font-style:italic;">
        Think beyond the sky...
      </p>
    </td>
  </tr>
</table>
