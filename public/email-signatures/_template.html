<!-- Email Signature — Template v3.3.1 -->
<table
  role="presentation"
  cellpadding="0"
  cellspacing="0"
  border="0"
  style="
    font-family: Arial, sans-serif;
    color: #1e2129;
    background: #ffffff;
    line-height: 1.35;
    -webkit-text-size-adjust: 100%;
    -ms-text-size-adjust: 100%;
  "
>
  <tr>
    <td style="padding: 0; background: #ffffff">
      <table
        role="presentation"
        cellpadding="0"
        cellspacing="0"
        border="0"
        style="border-collapse: collapse; background: #ffffff"
      >
        <tr>
          <td valign="middle" style="padding: 0 8px 0 8px">
            <img
              src="https://longhorn.construction/email-signatures/logo-art.png"
              alt="Longhorn Construction"
              height="110"
              style="
                display: block;
                height: 110px;
                width: auto;
                border: 0;
                outline: 0;
                text-decoration: none;
              "
            />
          </td>
          <td
            valign="top"
            style="
              width: 4px;
              background-color: #9e581a;
              font-size: 0;
              line-height: 0;
            "
          >
            <span style="display: block; width: 4px; height: 100%">&nbsp;</span>
          </td>
          <td valign="middle" style="padding: 0 8px 0 8px; background: #ffffff">
            <p
              style="
                margin: 0;
                font-size: 16px;
                font-weight: bold;
                color: #9e581a;
                line-height: 1.3;
              "
            >
              {{NAME}}
            </p>
            <p style="margin: 2px 0 0 0; font-size: 13px; line-height: 1.35">
              {{TITLE}}
            </p>

            <p style="margin: 10px 0 0 0; font-size: 12px; line-height: 1.45">
              <img
                src="https://longhorn.construction/email-signatures/icons/phone.png"
                alt=""
                width="16"
                height="16"
                style="
                  display: inline-block;
                  vertical-align: middle;
                  margin-right: 6px;
                "
              />
              <a
                href="tel:{{PHONE_E164}}"
                style="
                  color: #1e2129;
                  text-decoration: none;
                  vertical-align: middle;
                "
                >{{PHONE_PRETTY}}</a
              >
              <span style="color: #8a8f98">&nbsp;|&nbsp;</span>
              <a
                href="https://wa.me/{{WHATSAPP_LINK}}"
                style="text-decoration: none; vertical-align: middle"
              >
                <img
                  src="https://longhorn.construction/email-signatures/icons/whatsapp.png"
                  alt="WhatsApp"
                  width="16"
                  height="16"
                  style="
                    display: inline-block;
                    vertical-align: middle;
                    margin-left: 6px;
                  "
                />
              </a>
            </p>

            <p
              style="
                margin: 6px 0 0 0;
                font-size: 12px;
                line-height: 1.45;
                word-break: break-word;
              "
            >
              <img
                src="https://longhorn.construction/email-signatures/icons/mail.png"
                alt=""
                width="16"
                height="16"
                style="
                  display: inline-block;
                  vertical-align: middle;
                  margin-right: 6px;
                "
              />
              <a
                href="mailto:{{EMAIL}}"
                style="
                  color: #1e2129;
                  text-decoration: none;
                  vertical-align: middle;
                "
                >{{EMAIL}}</a
              >
            </p>

            <p style="margin: 6px 0 0 0; font-size: 12px; line-height: 1.45">
              <img
                src="https://longhorn.construction/email-signatures/icons/globe.png"
                alt=""
                width="16"
                height="16"
                style="
                  display: inline-block;
                  vertical-align: middle;
                  margin-right: 6px;
                "
              />
              <a
                href="https://longhorn.construction.com"
                style="
                  color: #9e601a;
                  text-decoration: none;
                  vertical-align: middle;
                "
                >longhorn.construction</a
              >
            </p>

            <p
              style="
                margin: 10px 0 0 0;
                font-size: 14px;
                color: #9e651a;
                font-weight: bold;
                font-style: italic;
                line-height: 1.3;
              "
            >
              From Texas to the World
            </p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
